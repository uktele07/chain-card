<h1>効果音の聞き比べ</h1>
<p class="note">2回目の候補です。名前ではなく、音の中身（立ち上がり、余韻の長さ、音の高さ）を解析して、重く乾いたものを選び直しました（CC0 の素材 約600音から）。▶ で鳴らし、良いものに印を付けてください。いまのゲームの音（合成）も「いまの音」で鳴らせます。いまのままがよい場面は「いまのままにする」に。最後に出る一覧を、そのまま送ってもらえれば反映します。</p>
